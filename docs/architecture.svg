<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="1170" viewBox="0 0 2000 1170" font-family="Helvetica, Arial, sans-serif">
<rect width="100%" height="100%" fill="#ffffff"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker></defs>
<text x="30" y="46" font-size="26" font-weight="bold" fill="#1a1a1a">Can LLMs resolve and interpret conflicting prognostic gene expression classifications in breast invasive carcinoma?</text>
<text x="30" y="76" font-size="14" fill="#666666">Blue box = script.   Yellow cylinder = data files.   Green hexagon = external model.   Bottom row = the three things the study measures: RESOLVE, INTERPRET, TRUST.</text>
<rect x="20" y="100" width="1960" height="230" rx="14" fill="#f7f7f7" stroke="#b5b5b5" stroke-width="2" stroke-dasharray="8 6"/>
<text x="40" y="128" font-size="15" font-weight="bold" fill="#555" letter-spacing="1">1 · THE CONFLICT</text>
<path d="M40,179 v92 a95.0,14 0 0 0 190,0 v-92 a95.0,14 0 0 0 -190,0 z" fill="#fff2cc" stroke="#d6b656" stroke-width="2.5"/>
<ellipse cx="135.0" cy="179" rx="95.0" ry="14" fill="#fff8e1" stroke="#d6b656" stroke-width="2.5"/>
<text x="135.0" y="215.8" font-size="16" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Input data</text>
<text x="135.0" y="237.7" font-size="13" fill="#444444" text-anchor="middle">TCGA-BRCA RNA-seq,</text>
<text x="135.0" y="258.7" font-size="13" fill="#444444" text-anchor="middle">clinical data</text>
<rect x="290" y="160" width="380" height="130" rx="10" fill="#dae8fc" stroke="#6c8ebf" stroke-width="2.5"/>
<text x="480.0" y="187.8" font-size="16" font-weight="bold" fill="#1a1a1a" text-anchor="middle">bioinformatics_pipeline.py</text>
<text x="480.0" y="209.7" font-size="13" fill="#444444" text-anchor="middle">scores 8 signatures (PAM50 via R genefu)</text>
<text x="480.0" y="230.7" font-size="13" fill="#444444" text-anchor="middle">median-splits each into High / Low risk</text>
<text x="480.0" y="251.7" font-size="13" fill="#444444" text-anchor="middle">defines discordant and concordant cohorts</text>
<text x="480.0" y="272.7" font-size="13" fill="#444444" text-anchor="middle">uses data_prep, classification_calculations</text>
<path d="M750,169 v112 a145.0,14 0 0 0 290,0 v-112 a145.0,14 0 0 0 -290,0 z" fill="#fff2cc" stroke="#d6b656" stroke-width="2.5"/>
<ellipse cx="895.0" cy="169" rx="145.0" ry="14" fill="#fff8e1" stroke="#d6b656" stroke-width="2.5"/>
<text x="895.0" y="205.3" font-size="16" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Processed cohorts</text>
<text x="895.0" y="227.2" font-size="13" fill="#444444" text-anchor="middle">Discordant: signatures clearly disagree</text>
<text x="895.0" y="248.2" font-size="13" fill="#444444" text-anchor="middle">Concordant: all 8 agree (known answer)</text>
<text x="895.0" y="269.2" font-size="13" fill="#444444" text-anchor="middle">Borderline: excluded</text>
<rect x="1100" y="165" width="280" height="120" rx="10" fill="#dae8fc" stroke="#6c8ebf" stroke-width="2.5"/>
<text x="1240.0" y="208.8" font-size="16" font-weight="bold" fill="#1a1a1a" text-anchor="middle">signature_definitions.py</text>
<text x="1240.0" y="230.7" font-size="13" fill="#444444" text-anchor="middle">gene sets and weights,</text>
<text x="1240.0" y="251.7" font-size="13" fill="#444444" text-anchor="middle">shared by scoring and prompts</text>
<rect x="1420" y="165" width="540" height="120" rx="8" fill="#ffffff" stroke="#999" stroke-width="1.5" stroke-dasharray="3 4"/>
<text x="1436" y="198.0" font-size="13" font-weight="bold" fill="#1a1a1a">What counts as a conflict</text>
<text x="1436" y="219.0" font-size="13" fill="#444444">Discordant: at least one signature puts the patient in its</text>
<text x="1436" y="240.0" font-size="13" fill="#444444">top 20% and another in its bottom 20% (margin in config.yml).</text>
<text x="1436" y="261.0" font-size="13" fill="#444444">Concordant: all eight agree, so the right answer is known.</text>
<path d="M230,225 L290,225" fill="none" stroke="#333" stroke-width="3" stroke-linejoin="round" marker-end="url(#a)" />
<rect x="243.1" y="201" width="27.8" height="18" fill="#f7f7f7" opacity="0.92"/>
<text x="260" y="214" font-size="13" fill="#1a1a1a" text-anchor="middle">raw</text>
<path d="M670,225 L750,225" fill="none" stroke="#333" stroke-width="3" stroke-linejoin="round" marker-end="url(#a)" />
<rect x="683.2" y="201" width="47.6" height="18" fill="#f7f7f7" opacity="0.92"/>
<text x="710" y="214" font-size="13" fill="#1a1a1a" text-anchor="middle">scores</text>
<rect x="20" y="360" width="1960" height="300" rx="14" fill="#f7f7f7" stroke="#b5b5b5" stroke-width="2" stroke-dasharray="8 6"/>
<text x="40" y="388" font-size="15" font-weight="bold" fill="#555" letter-spacing="1">2 · RESOLVE AND INTERPRET</text>
<path d="M40,419 v92 a105.0,14 0 0 0 210,0 v-92 a105.0,14 0 0 0 -210,0 z" fill="#fff2cc" stroke="#d6b656" stroke-width="2.5"/>
<ellipse cx="145.0" cy="419" rx="105.0" ry="14" fill="#fff8e1" stroke="#d6b656" stroke-width="2.5"/>
<text x="145.0" y="466.3" font-size="16" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Reactome pathways</text>
<text x="145.0" y="488.2" font-size="13" fill="#444444" text-anchor="middle">ReactomePathways.gmt</text>
<rect x="330" y="395" width="430" height="140" rx="10" fill="#dae8fc" stroke="#6c8ebf" stroke-width="2.5"/>
<text x="545.0" y="427.8" font-size="16" font-weight="bold" fill="#1a1a1a" text-anchor="middle">generation_pipeline.py</text>
<text x="545.0" y="449.7" font-size="13" fill="#444444" text-anchor="middle">evidence: clinical data, signature definitions,</text>
<text x="545.0" y="470.7" font-size="13" fill="#444444" text-anchor="middle">8 conflicting classes, expression, Reactome</text>
<text x="545.0" y="491.7" font-size="13" fill="#444444" text-anchor="middle">asks for: conflict diagnosis, root cause (interpret),</text>
<text x="545.0" y="512.7" font-size="13" fill="#444444" text-anchor="middle">then a High / Low Risk call (resolve)</text>
<polygon points="425.0,580 665.0,580 695,610.0 665.0,640 425.0,640 395,610.0" fill="#d5e8d4" stroke="#82b366" stroke-width="2.5"/>
<text x="545.0" y="604.3" font-size="16" font-weight="bold" fill="#1a1a1a" text-anchor="middle">LM Studio</text>
<text x="545.0" y="626.2" font-size="13" fill="#444444" text-anchor="middle">generation model</text>
<path d="M860,419 v92 a115.0,14 0 0 0 230,0 v-92 a115.0,14 0 0 0 -230,0 z" fill="#fff2cc" stroke="#d6b656" stroke-width="2.5"/>
<ellipse cx="975.0" cy="419" rx="115.0" ry="14" fill="#fff8e1" stroke="#d6b656" stroke-width="2.5"/>
<text x="975.0" y="455.8" font-size="16" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Generation results</text>
<text x="975.0" y="477.7" font-size="13" fill="#444444" text-anchor="middle">one CSV per model</text>
<text x="975.0" y="498.7" font-size="13" fill="#444444" text-anchor="middle">and ablation</text>
<rect x="1180" y="405" width="780" height="120" rx="8" fill="#ffffff" stroke="#999" stroke-width="1.5" stroke-dasharray="3 4"/>
<text x="1196" y="438.0" font-size="13" font-weight="bold" fill="#1a1a1a">Ablations (--ablation) remove evidence</text>
<text x="1196" y="459.0" font-size="13" fill="#444444">no_pathways, clinical_only, classes_only.</text>
<text x="1196" y="480.0" font-size="13" fill="#444444">They test what the model needs to see in order to</text>
<text x="1196" y="501.0" font-size="13" fill="#444444">interpret a conflict well.</text>
<path d="M250,465 L330,465" fill="none" stroke="#333" stroke-width="3" stroke-linejoin="round" marker-end="url(#a)" />
<rect x="256.6" y="441" width="60.8" height="18" fill="#f7f7f7" opacity="0.92"/>
<text x="290" y="454" font-size="13" fill="#1a1a1a" text-anchor="middle">pathways</text>
<path d="M760,465 L860,465" fill="none" stroke="#333" stroke-width="3" stroke-linejoin="round" marker-end="url(#a)" />
<rect x="779.9" y="441" width="54.2" height="18" fill="#f7f7f7" opacity="0.92"/>
<text x="810" y="454" font-size="13" fill="#1a1a1a" text-anchor="middle">results</text>
<path d="M545,535 L545,580" fill="none" stroke="#333" stroke-width="3" stroke-linejoin="round" marker-end="url(#a)" marker-start="url(#a)" />
<rect x="563.0" y="549" width="107.0" height="18" fill="#f7f7f7" opacity="0.92"/>
<text x="566" y="562" font-size="13" fill="#1a1a1a" text-anchor="start">prompt / answer</text>
<path d="M895,295 L895,345 L560,345 L560,395" fill="none" stroke="#333" stroke-width="3" stroke-linejoin="round" marker-end="url(#a)" />
<rect x="902.0" y="315" width="41.0" height="18" fill="#f7f7f7" opacity="0.92"/>
<text x="905" y="328" font-size="13" fill="#1a1a1a" text-anchor="start">cases</text>
<path d="M1240,285 L1240,378 L690,378 L690,395" fill="none" stroke="#333" stroke-width="3" stroke-linejoin="round" marker-end="url(#a)" />
<rect x="877.5" y="359" width="239.0" height="18" fill="#f7f7f7" opacity="0.92"/>
<text x="1000" y="372" font-size="13" fill="#1a1a1a" text-anchor="middle">signature definitions in the prompt</text>
<rect x="20" y="680" width="1960" height="370" rx="14" fill="#f7f7f7" stroke="#b5b5b5" stroke-width="2" stroke-dasharray="8 6"/>
<text x="40" y="708" font-size="15" font-weight="bold" fill="#555" letter-spacing="1">3 · EVALUATE</text>
<path d="M975,525 L975,725" fill="none" stroke="#333" stroke-width="3" stroke-linejoin="round" />
<path d="M240,725 L1310,725" fill="none" stroke="#333" stroke-width="3" stroke-linejoin="round" />
<path d="M240,725 L240,765" fill="none" stroke="#333" stroke-width="3" stroke-linejoin="round" marker-end="url(#a)" />
<path d="M750,725 L750,765" fill="none" stroke="#333" stroke-width="3" stroke-linejoin="round" marker-end="url(#a)" />
<path d="M1310,725 L1310,765" fill="none" stroke="#333" stroke-width="3" stroke-linejoin="round" marker-end="url(#a)" />
<rect x="982.0" y="687" width="54.2" height="18" fill="#f7f7f7" opacity="0.92"/>
<text x="985" y="700" font-size="13" fill="#1a1a1a" text-anchor="start">results</text>
<rect x="25" y="743" width="1550" height="194" rx="12" fill="none" stroke="#8a8a8a" stroke-width="2" stroke-dasharray="8 6"/>
<rect x="40" y="765" width="400" height="150" rx="10" fill="#dae8fc" stroke="#6c8ebf" stroke-width="2.5"/>
<text x="240.0" y="800.3" font-size="12" font-weight="bold" fill="#b45309" text-anchor="middle">RESOLVE</text>
<text x="240.0" y="822.8" font-size="16" font-weight="bold" fill="#1a1a1a" text-anchor="middle">concordant_check.py</text>
<text x="240.0" y="844.7" font-size="13" fill="#444444" text-anchor="middle">Does it reach the known answer?</text>
<text x="240.0" y="865.7" font-size="13" fill="#444444" text-anchor="middle">agreement with the unanimous consensus,</text>
<text x="240.0" y="886.7" font-size="13" fill="#444444" text-anchor="middle">confusion matrix, pass / fail gate (80%)</text>
<rect x="540" y="765" width="420" height="150" rx="10" fill="#dae8fc" stroke="#6c8ebf" stroke-width="2.5"/>
<text x="750.0" y="800.3" font-size="12" font-weight="bold" fill="#6d28d9" text-anchor="middle">INTERPRET</text>
<text x="750.0" y="822.8" font-size="16" font-weight="bold" fill="#1a1a1a" text-anchor="middle">evaluation_pipeline.py</text>
<text x="750.0" y="844.7" font-size="13" fill="#444444" text-anchor="middle">Is the explanation grounded?</text>
<text x="750.0" y="865.7" font-size="13" fill="#444444" text-anchor="middle">judge lists ungrounded claims, then scores</text>
<text x="750.0" y="886.7" font-size="13" fill="#444444" text-anchor="middle">biology, reasoning, resolution (1 to 5)</text>
<rect x="1060" y="765" width="500" height="150" rx="10" fill="#dae8fc" stroke="#6c8ebf" stroke-width="2.5"/>
<text x="1310.0" y="800.3" font-size="12" font-weight="bold" fill="#0e7490" text-anchor="middle">TRUST</text>
<text x="1310.0" y="822.8" font-size="16" font-weight="bold" fill="#1a1a1a" text-anchor="middle">semantic_entropy.py</text>
<text x="1310.0" y="844.7" font-size="13" fill="#444444" text-anchor="middle">Is the interpretation stable?</text>
<text x="1310.0" y="865.7" font-size="13" fill="#444444" text-anchor="middle">10 samples at T=1.0, clustered by entailment</text>
<text x="1310.0" y="886.7" font-size="13" fill="#444444" text-anchor="middle">semantic + risk entropy;  --validate gives AUROC</text>
<path d="M960,840 L1060,840" fill="none" stroke="#333" stroke-width="3" stroke-linejoin="round" marker-end="url(#a)" />
<rect x="963.4" y="816" width="87.2" height="18" fill="#f7f7f7" opacity="0.92"/>
<text x="1010" y="829" font-size="13" fill="#1a1a1a" text-anchor="middle">judge scores</text>
<polygon points="630.0,965 870.0,965 900,1000.0 870.0,1035 630.0,1035 600,1000.0" fill="#d5e8d4" stroke="#82b366" stroke-width="2.5"/>
<text x="750.0" y="994.3" font-size="16" font-weight="bold" fill="#1a1a1a" text-anchor="middle">LM Studio</text>
<text x="750.0" y="1016.2" font-size="13" fill="#444444" text-anchor="middle">judge model</text>
<path d="M750,915 L750,965" fill="none" stroke="#333" stroke-width="3" stroke-linejoin="round" marker-end="url(#a)" marker-start="url(#a)" />
<rect x="769.0" y="942" width="146.6" height="18" fill="#f7f7f7" opacity="0.92"/>
<text x="772" y="955" font-size="13" fill="#1a1a1a" text-anchor="start">judge prompt / scores</text>
<polygon points="1092.0,965 1268.0,965 1290,1000.0 1268.0,1035 1092.0,1035 1070,1000.0" fill="#d5e8d4" stroke="#82b366" stroke-width="2.5"/>
<text x="1180.0" y="994.3" font-size="16" font-weight="bold" fill="#1a1a1a" text-anchor="middle">LM Studio</text>
<text x="1180.0" y="1016.2" font-size="13" fill="#444444" text-anchor="middle">generation model</text>
<path d="M1180,915 L1180,965" fill="none" stroke="#333" stroke-width="3" stroke-linejoin="round" marker-end="url(#a)" marker-start="url(#a)" />
<rect x="1199.0" y="942" width="74.0" height="18" fill="#f7f7f7" opacity="0.92"/>
<text x="1202" y="955" font-size="13" fill="#1a1a1a" text-anchor="start">10 samples</text>
<polygon points="1352.0,965 1528.0,965 1550,1000.0 1528.0,1035 1352.0,1035 1330,1000.0" fill="#d5e8d4" stroke="#82b366" stroke-width="2.5"/>
<text x="1440.0" y="994.3" font-size="16" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Entailment model</text>
<text x="1440.0" y="1016.2" font-size="13" fill="#444444" text-anchor="middle">judge model or DeBERTa</text>
<path d="M1440,915 L1440,965" fill="none" stroke="#333" stroke-width="3" stroke-linejoin="round" marker-end="url(#a)" marker-start="url(#a)" />
<rect x="1459.0" y="942" width="120.2" height="18" fill="#f7f7f7" opacity="0.92"/>
<text x="1462" y="955" font-size="13" fill="#1a1a1a" text-anchor="start">entailment checks</text>
<path d="M1720,794 v92 a115.0,14 0 0 0 230,0 v-92 a115.0,14 0 0 0 -230,0 z" fill="#fff2cc" stroke="#d6b656" stroke-width="2.5"/>
<ellipse cx="1835.0" cy="794" rx="115.0" ry="14" fill="#fff8e1" stroke="#d6b656" stroke-width="2.5"/>
<text x="1835.0" y="830.8" font-size="16" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Evaluation outputs</text>
<text x="1835.0" y="852.7" font-size="13" fill="#444444" text-anchor="middle">agreement, judge scores,</text>
<text x="1835.0" y="873.7" font-size="13" fill="#444444" text-anchor="middle">entropy, AUROC</text>
<path d="M1575,840 L1720,840" fill="none" stroke="#333" stroke-width="3" stroke-linejoin="round" marker-end="url(#a)" />
<rect x="1616.9" y="816" width="54.2" height="18" fill="#f7f7f7" opacity="0.92"/>
<text x="1647" y="829" font-size="13" fill="#1a1a1a" text-anchor="middle">reports</text>
<rect x="30" y="1085" width="1940" height="56" rx="12" fill="#f5f5f5" stroke="#666" stroke-width="2" stroke-dasharray="8 6"/>
<text x="1000" y="1119" font-size="15" fill="#1a1a1a" text-anchor="middle"><tspan font-weight="bold">config.yml + .env</tspan>  Models, discordance margin, thresholds and API keys. Read by every script.</text>
</svg>
