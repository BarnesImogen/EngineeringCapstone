# CDSS Configuration Settings
#
# Both stages talk to any OpenAI-compatible endpoint (LM Studio, OpenAI, vLLM, ...).
# base_url below is the ONLY place the endpoint is set — generation_pipeline.py,
# evaluation_pipeline.py and semantic_entropy.py all read it from here, so switching
# LM Studio for a hosted service just means editing pipeline.base_url / evaluation.base_url
# (and model_name) below. Both base_url fields are required.
# Set the key in .env via GENERATION_API_KEY / JUDGE_API_KEY (environment variables
# override api_key below).
# Keep the judge model DIFFERENT from the generation model to avoid self-preference bias.

pipeline:
  model_name: "z-ai/glm-5.3-flash"
  base_url: "https://openrouter.ai/api/v1"
  api_key: "set-in-env"
  temperature: 0.1

evaluation:
  judge_model: "openai/gpt-oss-20b"
  judge_temperature: 0.0
  base_url: "https://openrouter.ai/api/v1"
  api_key: "set-in-env"
  # Minimum agreement with the unanimous consensus on concordant cases for a model to pass the sanity check
  min_concordant_agreement: 0.8
  # A summary passes a metric when its score is >= this threshold
  success_threshold: 4.0
  # Must match the score columns produced by evaluation_pipeline.py
  metrics:
    - "biological_synthesis"
    - "systematic_reasoning"
    - "prognostic_resolution"

# Optional. Default for --workers (max concurrent API requests) in generation_pipeline.py,
# evaluation_pipeline.py and semantic_entropy.py. Omit to use 8; --workers on the command line wins.
concurrency:
  workers: 8
